<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">FOUR AXES / A portrait of asymmetric labour</title>
<desc id="art-desc">An original diagrammatic artwork derived from a snapshot of Suzy Easton's GitHub activity overview, 72 percent commits, 27 percent pull requests, 1 percent issues and 0 percent code reviews. The irregular green shape is weighted left; this is a dated interpretation, not a live GitHub statistic.</desc>
<defs>
  <linearGradient id="dark" x2="1" y2="1"><stop stop-color="#030b0e"/><stop offset=".5" stop-color="#0a1513"/><stop offset="1" stop-color="#07100d"/></linearGradient>
  <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ff61"/><stop offset=".5" stop-color="#35e4a7"/><stop offset="1" stop-color="#8ecbff"/></linearGradient>
  <radialGradient id="smoke"><stop stop-color="#40fbb1" stop-opacity=".24"/><stop offset="1" stop-color="#40fbb1" stop-opacity="0"/></radialGradient>
  <pattern id="mesh" patternUnits="userSpaceOnUse" width="22" height="22"><circle cx="1.5" cy="1.5" r=".8" fill="#d0ffee" opacity=".12"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
